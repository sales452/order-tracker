<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEEEE3;
    --paper-raised:#FFFFFC;
    --ink:#1E2A38;
    --ink-soft:#4C5A6B;
    --line:#D8D5C6;
    --rust:#B33A2E;
    --rust-bg:#F6E2DE;
    --mustard:#B87B15;
    --mustard-bg:#F5E7CB;
    --slate:#3A5A78;
    --slate-bg:#DEE7EE;
    --forest:#3F6B4F;
    --forest-bg:#DEE9E1;
    --gray-bg:#E4E2D8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    padding:2.5rem 1.5rem 4rem;
  }
  .wrap{max-width:1240px;margin:0 auto;}
  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:1rem;margin-bottom:0;
  }
  h1{
    font-family:'Roboto Slab',serif;
    font-weight:700;
    font-size:2rem;
    margin:0;
    letter-spacing:-0.5px;
  }
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.75rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .perf{
    height:0;border-bottom:1px dashed var(--line);
    margin:0 0 1.5rem;
  }
  .toolbar{
    display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;
    margin:1.25rem 0 1.5rem;
  }
  .search{
    flex:1;min-width:200px;
    padding:0.6rem 0.9rem;
    border:1px solid var(--line);
    background:var(--paper-raised);
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    border-radius:3px;
  }
  .filters{display:flex;gap:0.4rem;flex-wrap:wrap;}
  .filter-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px;
    padding:0.45rem 0.75rem;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink-soft);
    cursor:pointer;border-radius:3px;
  }
  .filter-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  button.primary{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.8rem;
    background:var(--ink);color:var(--paper);
    border:none;padding:0.65rem 1.1rem;
    cursor:pointer;border-radius:3px;
    text-transform:uppercase;letter-spacing:0.5px;
  }
  button.primary:hover{background:var(--rust);}
  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;background:var(--line);
    border:1px solid var(--line);
    margin-bottom:1.5rem;
  }
  .stat{background:var(--paper-raised);padding:0.9rem 1rem;}
  .stat .n{font-family:'Roboto Slab',serif;font-size:1.5rem;font-weight:700;}
  .stat .l{font-size:0.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
  table{width:100%;border-collapse:collapse;background:var(--paper-raised);}
  thead th{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.66rem;text-transform:uppercase;letter-spacing:0.5px;
    color:var(--ink-soft);
    text-align:left;padding:0.6rem 0.6rem;
    border-bottom:2px solid var(--ink);
    white-space:nowrap;
  }
  tbody td{
    padding:0.6rem;
    border-bottom:1px solid var(--line);
    font-size:0.85rem;
    vertical-align:middle;
  }
  tbody tr.group-start td{ border-top:2px solid var(--ink); }
  tbody tr:hover{background:#F7F6EF;}
  .oid{font-family:'IBM Plex Mono',monospace;font-weight:500;}
  .muted{color:var(--ink-soft);}
  .badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;
    font-size:0.66rem;text-transform:uppercase;letter-spacing:0.5px;
    padding:0.25rem 0.5rem;border-radius:2px;font-weight:500;
    cursor:pointer;border:none;
  }
  .st-pending{background:var(--rust-bg);color:var(--rust);}
  .st-partial{background:var(--mustard-bg);color:var(--mustard);}
  .st-shipped{background:var(--slate-bg);color:var(--slate);}
  .st-delivered{background:var(--forest-bg);color:var(--forest);}
  .st-cancelled{background:var(--gray-bg);color:var(--ink-soft);}
  .rowbtn{
    background:none;border:1px solid var(--line);border-radius:3px;
    font-family:'IBM Plex Mono',monospace;font-size:0.68rem;
    padding:0.3rem 0.5rem;cursor:pointer;color:var(--ink-soft);margin-right:0.25rem;
  }
  .rowbtn:hover{border-color:var(--ink);color:var(--ink);}
  .empty{padding:2.5rem;text-align:center;color:var(--ink-soft);font-size:0.9rem;}
  .overlay{
    position:fixed;inset:0;background:rgba(30,42,56,0.45);
    display:none;align-items:flex-start;justify-content:center;
    padding:3rem 1rem;overflow:auto;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper-raised);
    border:1px solid var(--line);
    max-width:720px;width:100%;padding:1.75rem;border-radius:4px;
  }
  .modal h2{font-family:'Roboto Slab',serif;font-size:1.3rem;margin:0 0 1rem;}
  .field{margin-bottom:0.9rem;}
  .field label{display:block;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:0.3rem;font-family:'IBM Plex Mono',monospace;}
  .field input, .field select, .field textarea{
    width:100%;padding:0.55rem 0.7rem;border:1px solid var(--line);
    font-family:'Inter',sans-serif;font-size:0.9rem;border-radius:3px;background:var(--paper);
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.9rem;}
  .modal-actions{display:flex;justify-content:flex-end;gap:0.6rem;margin-top:1.25rem;}
  button.ghost{
    background:none;border:1px solid var(--line);padding:0.6rem 1rem;
    border-radius:3px;cursor:pointer;font-family:'Inter',sans-serif;font-size:0.85rem;
  }
  .items-block{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin:1rem 0;padding:1rem 0;}
  .items-header{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:0.6rem;}
  .item-row{display:grid;grid-template-columns:2fr 0.8fr 0.9fr 0.9fr 1fr 32px;gap:0.5rem;align-items:end;margin-bottom:0.6rem;}
  .item-row label{font-size:0.62rem;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:0.2rem;font-family:'IBM Plex Mono',monospace;}
  .item-row input, .item-row select{width:100%;padding:0.45rem 0.55rem;border:1px solid var(--line);font-size:0.85rem;border-radius:3px;background:var(--paper);}
  .item-remove{background:none;border:1px solid var(--line);border-radius:3px;cursor:pointer;color:var(--rust);height:34px;}
  .add-line{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px;background:none;border:1px dashed var(--line);border-radius:3px;padding:0.5rem 0.8rem;cursor:pointer;color:var(--ink-soft);}
  .add-line:hover{border-color:var(--ink);color:var(--ink);}
  .ship-row{display:grid;grid-template-columns:2fr 0.8fr 0.8fr 0.9fr 1fr;gap:0.5rem;align-items:center;padding:0.5rem 0;border-bottom:1px solid var(--line);font-size:0.85rem;}
  .ship-row.head{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;text-transform:uppercase;color:var(--ink-soft);border-bottom:2px solid var(--ink);}
  @media print{
    .toolbar,.filters,header button,.rowbtn{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Order Tracker</h1>
      <div class="tag">dispatch &amp; packing ledger</div>
    </div>
    <button class="primary" id="newOrderBtn">+ New order</button>
  </header>
  <div class="perf"></div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input class="search" id="search" placeholder="Search order id, PO number, customer, or item...">
    <div class="filters" id="filters"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Order ID</th><th>PO #</th><th>Date</th><th>Customer</th><th>Item</th>
        <th>Qty</th><th>Shipped</th><th>Remaining</th><th>Unit Price</th><th>Total</th><th>Status</th><th>Notes</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">No orders yet. Add your first order to get started.</div>
</div>

<div class="overlay" id="orderOverlay">
  <div class="modal">
    <h2 id="orderModalTitle">New order</h2>
    <div class="row3">
      <div class="field"><label>Customer name</label><input id="f-customer" list="customerList" autocomplete="off"></div>
      <div class="field"><label>PO number</label><input id="f-po" placeholder="Optional"></div>
      <div class="field"><label>Order date</label><input type="date" id="f-date"></div>
    </div>
    <datalist id="customerList"></datalist>
    <datalist id="itemList"></datalist>

    <div class="items-block">
      <div class="items-header">Line items</div>
      <div id="itemRows"></div>
      <button type="button" class="add-line" id="addLineBtn">+ Add line item</button>
    </div>

    <div class="field"><label>Notes</label><textarea id="f-notes" rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="ghost" id="cancelOrder">Cancel</button>
      <button class="primary" id="saveOrder">Save order</button>
    </div>
  </div>
</div>

<div class="overlay" id="shipOverlay">
  <div class="modal" style="max-width:640px;">
    <h2 id="shipModalTitle">Update shipped quantities</h2>
    <div id="shipBody"></div>
    <div class="modal-actions">
      <button class="ghost" id="printShip">Print</button>
      <button class="ghost" id="cancelShip">Cancel</button>
      <button class="primary" id="saveShip">Save</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCD0LrzF54SPZnPQMRkpoZqA8-oVmkR7go",
  authDomain: "order-tracking-790ce.firebaseapp.com",
  projectId: "order-tracking-790ce",
  storageBucket: "order-tracking-790ce.firebasestorage.app",
  messagingSenderId: "750223130794",
  appId: "1:750223130794:web:5a4e7e6b5eead3814fd0d3"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const ordersCol = collection(db, "orders");

const STATUSES = ["Pending","Partial","Shipped","Delivered","Cancelled"];
let orders = [];
let activeFilter = "All";
let searchTerm = "";
let editingId = null;
let lineSeq = 0;

function loadOrders(){
  onSnapshot(ordersCol, (snapshot) => {
    orders = snapshot.docs.map(d => d.data());
    render();
  }, (err) => {
    console.error("Failed to load orders from Firestore", err);
  });
}
async function saveOrderToDb(o){
  try{ await setDoc(doc(db, "orders", o.id), o); }
  catch(err){ console.error(err); alert("Could not save to the database. Check your connection and try again."); }
}
async function deleteOrderFromDb(id){
  try{ await deleteDoc(doc(db, "orders", id)); }
  catch(err){ console.error(err); alert("Could not delete from the database. Check your connection and try again."); }
}

function fmt(n){ return "\u20b9" + Number(n||0).toLocaleString("en-IN", {maximumFractionDigits:2}); }
function nextId(){
  const nums = orders.map(o => parseInt((o.id||"").replace("ORD-",""),10)).filter(n=>!isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return "ORD-" + String(next).padStart(3,"0");
}
function itemStatus(it){
  if (it.status === "Delivered" || it.status === "Cancelled") return it.status;
  const shipped = Number(it.shippedQty)||0, qty = Number(it.qty)||0;
  if (shipped <= 0) return "Pending";
  if (shipped >= qty) return "Shipped";
  return "Partial";
}
function statusClass(s){ return "st-" + s.toLowerCase(); }

function renderFilters(){
  const el = document.getElementById("filters");
  el.innerHTML = "";
  ["All", ...STATUSES].forEach(s => {
    const b = document.createElement("button");
    b.className = "filter-btn" + (activeFilter===s ? " active":"");
    b.textContent = s;
    b.onclick = () => { activeFilter = s; render(); };
    el.appendChild(b);
  });
}

function renderStats(){
  const el = document.getElementById("stats");
  let totalOrders = orders.length, totalLines = 0, pendingVal = 0, deliveredCount = 0, allVal = 0;
  orders.forEach(o => (o.items||[]).forEach(it => {
    totalLines++;
    const st = itemStatus(it);
    const remaining = Math.max(0, (Number(it.qty)||0) - (Number(it.shippedQty)||0));
    allVal += (Number(it.qty)||0) * (Number(it.price)||0);
    if (st === "Pending" || st === "Partial") pendingVal += remaining * (Number(it.price)||0);
    if (st === "Delivered") deliveredCount++;
  }));
  el.innerHTML = `
    <div class="stat"><div class="n">${totalOrders}</div><div class="l">Orders</div></div>
    <div class="stat"><div class="n">${totalLines}</div><div class="l">Line items</div></div>
    <div class="stat"><div class="n">${fmt(pendingVal)}</div><div class="l">Pending value</div></div>
    <div class="stat"><div class="n">${deliveredCount}</div><div class="l">Delivered lines</div></div>
    <div class="stat"><div class="n">${fmt(allVal)}</div><div class="l">Total value</div></div>
  `;
}

function orderMatches(o){
  if (!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  if ((o.id+" "+(o.poNumber||"")+" "+o.customer).toLowerCase().includes(t)) return true;
  return (o.items||[]).some(it => (it.item||"").toLowerCase().includes(t));
}

function renderRows(){
  const tbody = document.getElementById("rows");
  const visible = orders.filter(orderMatches);
  let html = "";
  let anyRows = false;
  visible.forEach(o => {
    const items = (o.items||[]).filter(it => activeFilter==="All" || itemStatus(it)===activeFilter);
    if (!items.length) return;
    items.forEach((it, idx) => {
      anyRows = true;
      const st = itemStatus(it);
      const remaining = Math.max(0, (Number(it.qty)||0) - (Number(it.shippedQty)||0));
      const isFirst = idx === 0;
      html += `<tr class="${isFirst ? "group-start" : ""}">
        <td class="oid">${isFirst ? o.id : ""}</td>
        <td>${isFirst ? (o.poNumber||"\u2014") : ""}</td>
        <td>${isFirst ? o.date : ""}</td>
        <td>${isFirst ? o.customer : ""}</td>
        <td>${it.item}</td>
        <td>${it.qty}</td>
        <td>${it.shippedQty||0}</td>
        <td>${remaining}</td>
        <td>${fmt(it.price)}</td>
        <td>${fmt((it.qty||0)*(it.price||0))}</td>
        <td><span class="badge ${statusClass(st)}">${st}</span></td>
        <td class="muted" style="max-width:140px;font-size:0.78rem;">${isFirst ? (o.notes||"") : ""}</td>
        <td style="white-space:nowrap;">${isFirst ? `
          <button class="rowbtn" onclick="window.openEdit('${o.id}')">Edit</button>
          <button class="rowbtn" onclick="window.openShip('${o.id}')">Ship</button>
          <button class="rowbtn" onclick="window.deleteOrder('${o.id}')">Delete</button>
        ` : ""}</td>
      </tr>`;
    });
  });
  document.getElementById("emptyMsg").style.display = anyRows ? "none" : "block";
  tbody.innerHTML = html;
}

function populateDatalists(){
  const customers = [...new Set(orders.map(o=>o.customer).filter(Boolean))].sort();
  const items = [...new Set(orders.flatMap(o=>(o.items||[]).map(it=>it.item)).filter(Boolean))].sort();
  document.getElementById("customerList").innerHTML = customers.map(c=>`<option value="${c}">`).join("");
  document.getElementById("itemList").innerHTML = items.map(i=>`<option value="${i}">`).join("");
}

function render(){ renderFilters(); renderStats(); renderRows(); populateDatalists(); }

window.deleteOrder = function(id){
  if(!confirm("Delete order " + id + " and all its line items?")) return;
  deleteOrderFromDb(id);
};

document.getElementById("search").addEventListener("input", e=>{
  searchTerm = e.target.value; renderRows();
});

// ---- New / Edit order modal ----
const orderOverlay = document.getElementById("orderOverlay");
const itemRowsEl = document.getElementById("itemRows");

function addLineRow(data){
  const id = "line" + (lineSeq++);
  const row = document.createElement("div");
  row.className = "item-row";
  row.dataset.rowId = id;
  row.innerHTML = `
    <div><label>Item / part number</label><input class="li-item" list="itemList" autocomplete="off" value="${data && data.item ? data.item : ""}"></div>
    <div><label>Qty</label><input class="li-qty" type="number" min="0" value="${data && data.qty!=null ? data.qty : 1}"></div>
    <div><label>Unit price</label><input class="li-price" type="number" min="0" step="0.01" value="${data && data.price!=null ? data.price : ""}"></div>
    <div><label>Shipped qty</label><input class="li-shipped" type="number" min="0" value="${data && data.shippedQty!=null ? data.shippedQty : 0}"></div>
    <div><label>Status</label>
      <select class="li-status">
        ${STATUSES.map(s=>`<option ${data && data.status===s ? "selected":""}>${s}</option>`).join("")}
      </select>
    </div>
    <button type="button" class="item-remove" title="Remove line">\u2715</button>
  `;
  row.querySelector(".item-remove").onclick = () => row.remove();
  itemRowsEl.appendChild(row);
}
document.getElementById("addLineBtn").onclick = () => addLineRow();

function readLineRows(){
  return [...itemRowsEl.querySelectorAll(".item-row")].map(row => {
    const item = row.querySelector(".li-item").value.trim();
    const qty = Number(row.querySelector(".li-qty").value)||0;
    const price = Number(row.querySelector(".li-price").value)||0;
    const shippedQty = Number(row.querySelector(".li-shipped").value)||0;
    const status = row.querySelector(".li-status").value;
    return { item, qty, price, shippedQty, status };
  }).filter(it => it.item);
}

document.getElementById("newOrderBtn").onclick = () => {
  editingId = null;
  document.getElementById("orderModalTitle").textContent = "New order";
  document.getElementById("f-customer").value = "";
  document.getElementById("f-po").value = "";
  document.getElementById("f-date").value = new Date().toISOString().slice(0,10);
  document.getElementById("f-notes").value = "";
  itemRowsEl.innerHTML = "";
  addLineRow();
  orderOverlay.classList.add("show");
};

window.openEdit = function(id){
  const o = orders.find(x=>x.id===id);
  if(!o) return;
  editingId = id;
  document.getElementById("orderModalTitle").textContent = "Edit order " + o.id;
  document.getElementById("f-customer").value = o.customer;
  document.getElementById("f-po").value = o.poNumber || "";
  document.getElementById("f-date").value = o.date;
  document.getElementById("f-notes").value = o.notes || "";
  itemRowsEl.innerHTML = "";
  (o.items && o.items.length ? o.items : [{}]).forEach(it => addLineRow(it));
  orderOverlay.classList.add("show");
};

document.getElementById("cancelOrder").onclick = () => { orderOverlay.classList.remove("show"); editingId = null; };
document.getElementById("saveOrder").onclick = () => {
  const customer = document.getElementById("f-customer").value.trim();
  const items = readLineRows();
  if(!customer){ alert("Customer name is required."); return; }
  if(!items.length){ alert("Add at least one line item."); return; }
  const date = document.getElementById("f-date").value || new Date().toISOString().slice(0,10);
  const poNumber = document.getElementById("f-po").value.trim();
  const notes = document.getElementById("f-notes").value.trim();

  const order = {
    id: editingId || nextId(),
    poNumber, date, customer, notes, items
  };
  saveOrderToDb(order);
  editingId = null;
  orderOverlay.classList.remove("show");
};

// ---- Ship modal ----
const shipOverlay = document.getElementById("shipOverlay");
let shippingId = null;
window.openShip = function(id){
  shippingId = id;
  const o = orders.find(x=>x.id===id);
  if(!o) return;
  document.getElementById("shipModalTitle").textContent = "Update shipped quantities \u2014 " + o.id;
  const body = document.getElementById("shipBody");
  body.innerHTML = `<div class="ship-row head"><span>Item</span><span>Ordered</span><span>Shipped</span><span>Remaining</span><span>New shipped qty</span></div>` +
    (o.items||[]).map((it, i) => {
      const remaining = Math.max(0,(it.qty||0)-(it.shippedQty||0));
      return `<div class="ship-row" data-idx="${i}">
        <span>${it.item}</span><span>${it.qty}</span><span>${it.shippedQty||0}</span><span>${remaining}</span>
        <input type="number" class="ship-input" min="0" max="${it.qty}" value="${it.shippedQty||0}">
      </div>`;
    }).join("");
  shipOverlay.classList.add("show");
};
document.getElementById("cancelShip").onclick = () => shipOverlay.classList.remove("show");
document.getElementById("printShip").onclick = () => window.print();
document.getElementById("saveShip").onclick = () => {
  const o = orders.find(x=>x.id===shippingId);
  if(!o) return;
  const rows = [...document.querySelectorAll("#shipBody .ship-row[data-idx]")];
  rows.forEach(row => {
    const idx = Number(row.dataset.idx);
    const val = Number(row.querySelector(".ship-input").value)||0;
    o.items[idx].shippedQty = Math.min(val, o.items[idx].qty);
    o.items[idx].status = itemStatus(o.items[idx]);
  });
  saveOrderToDb(o);
  shipOverlay.classList.remove("show");
};

loadOrders();
</script>
</body>
</html>
